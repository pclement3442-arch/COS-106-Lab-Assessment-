<body>
<header class="top"><a class="logo" href="index.html" aria-label="Clement Precious, home">C<b>.</b>P</a><nav id="nav" aria-label="Main"><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="planner.html">Planner</a></li><li><a href="contact.html" class="active" aria-current="page">Contact</a></li></ul></nav><div class="tools"><button class="ib" id="theme" aria-label="Switch light or dark theme">&#9788;</button><button class="ib" id="menuBtn" aria-label="Menu" aria-expanded="false">&#9776;</button></div></header>
<main>
<section class="wrap"><div class="cgrid"><div><h1>Let's talk</h1><p class="lead">Have a question, an idea or a project in mind? Send me a message and I will get back to you.</p></div>
<div><form id="contactForm" novalidate><label for="name">Name</label><input type="text" id="name" autocomplete="name"><span class="err" id="nameErr"></span>
<label for="email">Email address</label><input type="email" id="email" autocomplete="email"><span class="err" id="emailErr"></span>
<label for="phone">Phone number</label><input type="text" id="phone" inputmode="numeric" autocomplete="tel"><span class="err" id="phoneErr"></span>
<label for="message">Message</label><textarea id="message" rows="5"></textarea><span class="err" id="messageErr"></span>
<button class="btn" type="submit">Send message</button></form><div class="ok" id="okBox" role="status"><h2>Message sent</h2><p id="okText"></p><button class="btn" id="again" type="button">Send another</button></div></div></div></section>
</main>
